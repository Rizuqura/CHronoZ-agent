[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronoz-benchmark-engine"
version = "0.1.0"
description = "Portable research-based economic benchmark measurements"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<4", "PyYAML>=6,<7", "jsonschema>=4.18,<5"]

[project.scripts]
chronoz-benchmark = "chronoz_benchmark.service.cli:main"

[tool.setuptools.packages.find]
include = ["chronoz_benchmark*"]

[tool.setuptools]
include-package-data = true
